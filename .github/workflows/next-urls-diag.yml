name: next-urls-diag
on:
  push:
    paths:
      - ".github/workflows/next-urls-diag.yml"
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          CITY_PRIORITY: ${{ vars.CITY_PRIORITY }}
          BRAND_PRIORITY: ${{ vars.BRAND_PRIORITY }}
          PODCAST_SITE: ${{ vars.PODCAST_SITE }}
        run: |
          python - <<'EOF'
          import json
          from src import fetch_car
          s = json.load(open("state.json"))
          done = set(s.get("processed_urls", []))
          urls = fetch_car.collect_car_urls()
          todo = [u for u in urls if u not in done]
          print("TOTAL", len(urls), "DONE", len(done), "TODO", len(todo))
          for i, u in enumerate(todo[:10], 1):
              print("NEXT", i, u)
          EOF

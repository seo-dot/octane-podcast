name: Sitemap diagnostic (one-off, read-only)

on:
  push:
    paths:
      - ".github/workflows/sitemap-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: daily-podcast
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Summary
        run: |
          python3 - <<'PY'
          import json, re, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (compatible; OctanePodcastBot/1.0; +https://octane.rent)"}

          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30).read().decode("utf-8", "replace")

          def locs(x):
              return re.findall(r"<loc>\s*([^<\s]+)\s*</loc>", x)

          pattern = re.compile(r"(cars|car-rental|for-rent|suv|sports|luxury|convertible|sedan|coupe|premium)", re.I)
          LANG = re.compile(r"octane\.rent/(ru|de|nl|ar|fr|it|es|pt|da|sv|tr|zh)/")
          CITIES = ["dubai", "abu-dhabi", "sharjah", "miami"]

          def city(u):
              low = u.lower()
              for c in CITIES:
                  if c in low or c.replace("-", " ") in low:
                      return c
              return "other"

          done = set(json.load(open("state.json"))["processed_urls"])
          idx = get("https://octane.rent/sitemap.xml")
          subs = [u for u in locs(idx) if u.endswith(".xml")] or ["https://octane.rent/sitemap.xml"]
          matched, dropped, seen = [], [], set()
          for sm in subs:
              if any(x in sm for x in ("blog", "knowledge", "yachts", "pages")):
                  continue
              for u in locs(get(sm)):
                  if u.endswith(".xml") or LANG.search(u) or u in seen:
                      continue
                  seen.add(u)
                  (matched if pattern.search(u) else dropped).append(u)

          print(f"matched by filter={len(matched)}  dropped by URL pattern={len(dropped)}  already used={len(done)}")
          print("city        matched  used  left   | dropped")
          for c in CITIES + ["other"]:
              m = [u for u in matched if city(u) == c]
              d = [u for u in m if u in done]
              x = [u for u in dropped if city(u) == c]
              print(f"{c:11} {len(m):7} {len(d):5} {len(m) - len(d):5}   | {len(x):5}")
          order = {c: i for i, c in enumerate(CITIES + ["other"])}
          todo = sorted([u for u in matched if u not in done], key=lambda u: order[city(u)])
          print(f"\nSTILL TO DO by the current filter: {len(todo)}")
          for u in todo:
              print("  ", city(u).ljust(9), u)
          print("\nused but NOT matched by today's filter (should be 0):",
                len([u for u in done if u not in set(matched)]))
          PY

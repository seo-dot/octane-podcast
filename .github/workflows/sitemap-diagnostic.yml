name: Sitemap diagnostic (one-off, read-only)

on:
  push:
    paths:
      - ".github/workflows/sitemap-diagnostic.yml"

permissions:
  contents: read

# Та же группа, что у daily.yml: не работаем одновременно с ежедневным выпуском.
concurrency:
  group: daily-podcast
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare sitemap with the page filter
        run: |
          python3 - <<'PY'
          import json, re, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (compatible; OctanePodcastBot/1.0; +https://octane.rent)"}

          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30).read().decode("utf-8", "replace")

          def locs(x):
              return re.findall(r"<loc>\s*([^<\s]+)\s*</loc>", x)

          pattern = re.compile(r"(cars|car-rental|for-rent|suv|sports|luxury|convertible|sedan|coupe|premium)", re.I)
          LANG = re.compile(r"octane\.rent/(ru|de|nl|ar|fr|it|es|pt|da|sv|tr|zh)/")
          CITIES = ["dubai", "abu-dhabi", "sharjah", "miami"]

          def city(u):
              low = u.lower()
              for c in CITIES:
                  if c in low or c.replace("-", " ") in low:
                      return c
              return "other"

          state = json.load(open("state.json"))
          done = set(state["processed_urls"])

          idx = get("https://octane.rent/sitemap.xml")
          subs = [u for u in locs(idx) if u.endswith(".xml")] or ["https://octane.rent/sitemap.xml"]
          print("sub-sitemaps:")
          matched, unmatched, excluded = [], [], []
          seen = set()
          for sm in subs:
              skip = any(x in sm for x in ("blog", "knowledge", "yachts", "pages"))
              try:
                  us = [u for u in locs(get(sm)) if not u.endswith(".xml")]
              except Exception as e:
                  print("  ERROR", sm, e)
                  continue
              print(f"  {sm}  urls={len(us)}  {'EXCLUDED by name' if skip else ''}")
              for u in us:
                  if LANG.search(u) or u in seen:
                      continue
                  seen.add(u)
                  if skip:
                      excluded.append(u)
                  elif pattern.search(u):
                      matched.append(u)
                  else:
                      unmatched.append(u)

          print(f"\nEnglish URLs: matched by filter={len(matched)}, dropped by URL pattern={len(unmatched)}, in excluded sub-sitemaps={len(excluded)}")
          print(f"already used by the podcast: {len(done)}")
          print("\nper city (matched | used | still to do):")
          for c in CITIES + ["other"]:
              m = [u for u in matched if city(u) == c]
              d = [u for u in m if u in done]
              print(f"  {c:10} {len(m):4} | {len(d):4} | {len(m) - len(d):4}")

          print("\nSTILL TO DO, in the order the podcast will take them (first 40):")
          order = {c: i for i, c in enumerate(CITIES + ["other"])}
          todo = sorted([u for u in matched if u not in done], key=lambda u: order[city(u)])
          for u in todo[:40]:
              print("  ", city(u).ljust(9), u)

          print("\nCITY PAGES DROPPED by the URL pattern (dubai/abu-dhabi/sharjah/miami in the address):")
          for u in unmatched:
              if city(u) != "other":
                  print("  ", city(u).ljust(9), u)

          print("\nOTHER dropped URLs (first 40):")
          for u in [u for u in unmatched if city(u) == "other"][:40]:
              print("  ", u)

          print("\nCity pages in excluded sub-sitemaps (first 25):")
          for u in [u for u in excluded if city(u) != "other"][:25]:
              print("  ", city(u).ljust(9), u)
          PY
